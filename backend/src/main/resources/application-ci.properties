# CI smoke tests: isolated in-memory H2 database; never use production settings.
spring.config.activate.on-profile=ci
spring.datasource.url=jdbc:h2:mem:ci;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed-h2.sql
spring.h2.console.enabled=false
