<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approvals</title><link rel="stylesheet" href="/css/styles.css"><script type="importmap">{"imports":{"motion":"https://cdn.jsdelivr.net/npm/motion@12.16.0/+esm"}}</script></head><body>
<div class="navbar"><div class="brand"><a href="/pages/browse.html">Campus Booking</a></div><nav class="nav-right"><a href="/pages/browse.html">Browse</a><a href="/pages/visualization.html">Visualization</a><a data-role="TEACHER" href="/pages/approvals.html">Approvals</a><a data-role="SUPERADMIN" href="/pages/admin.html">Admin</a><div class="account-wrap"><button class="account-btn" onclick="toggleAccount(event)">Account ▾</button><div id="accountDropdown" class="account-dropdown hidden"><div id="accountName" style="font-weight:600"></div><div id="accountEmail" style="font-size:12px;color:#666"></div><div id="accountRole" style="font-size:12px;color:#666;margin-bottom:8px"></div><a href="/pages/my-bookings.html" class="btn btn-outline btn-small" style="display:block;text-align:center;margin-bottom:8px">My Bookings</a><button class="btn btn-danger btn-small" style="width:100%" onclick="doLogout()">Logout</button></div></div></nav></div>
<div class="container"><h2>Pending Approvals</h2><p style="color:#666;font-size:14px">Any teacher can approve/reject — first to act wins.</p><div id="list"></div></div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script>
<script type="module">
import { animate } from 'motion';
checkAuth().then(me=>{
  if(me && !(me.role==='TEACHER'||me.role==='SUPERADMIN')) location.href='/pages/browse.html';
  if(me){ document.getElementById('accountName').textContent=me.name; document.getElementById('accountEmail').textContent=me.email; document.getElementById('accountRole').textContent=me.role; }
});
window.toggleAccount=function(e){ e.stopPropagation(); document.getElementById('accountDropdown').classList.toggle('hidden'); };
document.addEventListener('click', ()=> document.getElementById('accountDropdown').classList.add('hidden'));
animate('.navbar', { opacity:[0,1], y:[-6,0]}, { duration:0.3 });
async function load(){
  try{
    const data=await API.pendingQueue();
    if(!data.length) { document.getElementById('list').innerHTML='<p>No pending requests</p>'; return; }
    document.getElementById('list').innerHTML='<table><tr><th>Student</th><th>Room</th><th>Date</th><th>Slot</th><th>Purpose</th><th>Actions</th></tr>'+data.map(b=>`<tr><td>${b.userName} (${b.userEmail})</td><td>${b.roomName} (${b.building})</td><td>${b.bookingDate}</td><td>${b.startTime}</td><td>${b.purpose||'-'}</td><td><button class="btn btn-primary btn-small" onclick="approve(${b.id})">Approve</button> <button class="btn btn-danger btn-small" onclick="reject(${b.id})">Reject</button></td></tr>`).join('')+'</table>';
  }catch(e){ document.getElementById('list').textContent=e.message; }
}
window.approve=async function(id){ try{ await API.approve(id); load(); }catch(e){ alert(e.message); load(); } }
window.reject=async function(id){
  const reason=prompt('Rejection reason (optional):')||'';
  try{ await API.reject(id,reason); load(); }catch(e){ alert(e.message); load(); }
}
load();
</script>
</body></html>
