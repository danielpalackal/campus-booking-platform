server.port=8080
spring.application.name=campus-booking-platform

# H2 in-memory for local dev (no MySQL needed)
spring.datasource.url=jdbc:h2:mem:campusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Seed on startup
spring.sql.init.data-locations=classpath:seed.sql

# Jackson timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd

# JWT
app.jwt.secret=change-this-to-a-very-long-random-secret-key-for-campus-booking-at-least-64-bytes-long-change-me
app.jwt.expiration-ms=86400000

# Google OAuth (set real values in application-local.properties for prod)
app.google.client-id=REPLACE_WITH_GOOGLE_CLIENT_ID
app.oauth.allowed-domain=xaviers.edu.in

# Mail (async best-effort; configure in application-local.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

logging.level.com.xaviers.booking=INFO
